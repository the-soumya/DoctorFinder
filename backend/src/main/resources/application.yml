server:
  port: ${SERVER_PORT:8082}
  error:
    include-message: always
    include-binding-errors: always

spring:
  application:
    name: patient-health-portal
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:patient_portal}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 20
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 15MB

# Application-specific Custom Configurations
app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: 86400000
    refresh-expiration-ms: 604800000
  security:
    encryption-key: ${FIELD_ENCRYPTION_KEY}
  razorpay:
    key-id: ${RAZORPAY_KEY_ID}
    key-secret: ${RAZORPAY_KEY_SECRET}
    webhook-secret: ${RAZORPAY_WEBHOOK_SECRET}
    mock-mode: ${RAZORPAY_MOCK_MODE:false}
  cancellation:
    full-refund-hours: 24
  ai:
    gemini-api-key: ${GEMINI_API_KEY}
    openai-api-key: ${OPENAI_API_KEY:}
    rate-limit:
      capacity: 10
      refill-tokens: 10
      refill-duration-minutes: 1

# OpenAPI / Swagger Documentation
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
